# Serves the built React app and reverse-proxies /api to the NestJS container (same origin => HttpOnly cookie + CSRF work).
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Webhook bodies are capped at 64 KB by the app; JSON API bodies at 100 KB. Reject anything bigger here first.
    client_max_body_size 128k;
    client_body_timeout 15s;

    # Docker's embedded DNS; resolving at request time lets nginx start before / survive a backend restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        set $upstream http://backend:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (do not append to) the client-supplied value: the backend trusts exactly one proxy hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # Payment / student data must never be cached by browsers or intermediaries.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }

    # Hashed build assets: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # SPA: unknown paths fall back to index.html (browser-history routing). index.html itself is never cached.
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
